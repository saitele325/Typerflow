<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <!-- Google tag (gtag.js) -->

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Typer Flow — Typing Speed Test</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-overlay"></div>

  <header class="header">
    <div class="logo">
      <a href="index.html" class="btn-icon" title="Back to home" aria-label="Back to home" style="margin-right: 0.25rem;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
      </a>
      <svg class="logo-icon" width="28" height="28" viewBox="0 0 28 28" fill="none">
         <img src="logo.png" width="40" height="40" alt="Logo">
      </svg>
      <span class="logo-text">Typer Flow</span>
    </div>
    <div class="header-actions">
      <button class="btn-icon" id="soundToggle" title="Toggle sound" aria-label="Toggle sound">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
          <path class="sound-on" d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/>
          <line class="sound-off" x1="23" y1="9" x2="17" y2="15" style="display:none"/>
          <line class="sound-off" x1="17" y1="9" x2="23" y2="15" style="display:none"/>
        </svg>
      </button>
      <button class="btn-icon" id="themeToggle" title="Toggle theme" aria-label="Toggle theme">
        <svg class="icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"/>
          <line x1="12" y1="1" x2="12" y2="3"/>
          <line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1" y1="12" x2="3" y2="12"/>
          <line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
        <svg class="icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>
    </div>
  </header>

  <main class="main">
    <div class="glass-card" id="typingCard">
      <!-- Timer Display -->
      <div class="timer-display" id="timerDisplay">30</div>

      <!-- Config Bar -->
      <div class="config-bar" id="configBar">
        <div class="config-group">
          <span class="config-label">time</span>
          <div class="config-options" id="timeOptions">
            <button class="config-btn" data-time="15">15</button>
            <button class="config-btn active" data-time="30">30</button>
            <button class="config-btn" data-time="60">60</button>
            <button class="config-btn" data-time="120">120</button>
          </div>
        </div>
        <div class="config-group">
          <span class="config-label">mode</span>
          <div class="config-options" id="modeOptions">
            <button class="config-btn active" data-mode="words">words</button>
            <button class="config-btn" data-mode="quote">quote</button>
          </div>
        </div>
        <div class="config-group" id="wordCountGroup">
          <span class="config-label">words</span>
          <div class="config-options" id="wordCountOptions">
            <button class="config-btn" data-count="25">25</button>
            <button class="config-btn active" data-count="50">50</button>
            <button class="config-btn" data-count="100">100</button>
          </div>
        </div>
      </div>

      <!-- Live Stats -->
      <div class="live-stats" id="liveStats">
        <div class="live-stat">
          <span class="live-stat-value" id="liveWpm">0</span>
          <span class="live-stat-label">wpm</span>
        </div>
        <div class="live-stat">
          <span class="live-stat-value" id="liveAccuracy">100</span>
          <span class="live-stat-label">acc%</span>
        </div>
      </div>

      <!-- Typing Area -->
      <div class="typing-area" id="typingArea" tabindex="0">
        <div class="text-display" id="textDisplay"></div>
        <input type="text" class="hidden-input" id="hiddenInput" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="Type here">
      </div>

      <!-- Restart Hint -->
      <div class="restart-hint" id="restartHint">
        press <kbd>Tab</kbd> + <kbd>Enter</kbd> to restart
      </div>
    </div>

    <!-- Results Screen -->
    <div class="results-overlay" id="resultsOverlay" style="display:none">
      <div class="results-card glass-card">
        <h2 class="results-title">Results</h2>
        <div class="results-wpm">
          <span class="results-wpm-value" id="resultWpm">0</span>
          <span class="results-wpm-label">wpm</span>
        </div>
        <div class="results-accuracy">
          <span class="results-accuracy-value" id="resultAccuracy">0%</span>
          <span class="results-accuracy-label">accuracy</span>
        </div>
        <div class="results-details">
          <div class="result-detail">
            <span class="result-detail-value" id="resultRawWpm">0</span>
            <span class="result-detail-label">raw wpm</span>
          </div>
          <div class="result-detail">
            <span class="result-detail-value" id="resultCorrectChars">0</span>
            <span class="result-detail-label">correct</span>
          </div>
          <div class="result-detail">
            <span class="result-detail-value" id="resultIncorrectChars">0</span>
            <span class="result-detail-label">incorrect</span>
          </div>
          <div class="result-detail">
            <span class="result-detail-value" id="resultTime">0s</span>
            <span class="result-detail-label">time</span>
          </div>
        </div>
        <div class="results-chart-container">
          <canvas id="wpmChart" width="500" height="160"></canvas>
        </div>
        <div class="results-personal-best" id="personalBestSection">
          <div class="personal-best-badge" id="personalBestBadge" style="display:none">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
            New Personal Best!
          </div>
          <div class="results-history" id="resultsHistory">
            <h3>Recent Tests</h3>
            <div class="history-list" id="historyList"></div>
          </div>
        </div>
        <button class="btn-restart" id="restartBtn">Try Again</button>
      </div>
    </div>
  </main>

  <script src="textGenerator.js"></script>
  <script src="timer.js"></script>
  <script src="stats.js"></script>
  <script src="storage.js"></script>
  <script src="app.js"></script>
</body>
</html>
